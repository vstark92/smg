<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sri Murugan Gold</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
      overflow: hidden;
    }

    /* Subtle gold grain background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(180,140,60,0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 100%, rgba(180,140,60,0.05) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 900px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: fadeIn 1s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .brand {
      letter-spacing: 0.25em;
      font-size: 0.75rem;
      color: #b8922a;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .video-wrapper {
      width: 100%;
      border: 1px solid rgba(180,140,60,0.2);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(0,0,0,0.8), 0 0 20px rgba(180,140,60,0.05);
      background: #000;
    }

    video {
      width: 100%;
      display: block;
      max-height: 80vh;
      object-fit: contain;
      background: #000;
    }

    .divider {
      width: 60px;
      height: 1px;
      background: linear-gradient(to right, transparent, #b8922a, transparent);
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="brand">Sri Murugan Gold — Bankers &amp; Finance</span>
    <div class="video-wrapper">
      <video
        id="vid"
        autoplay
        muted
        playsinline
        controls
        preload="auto"
      >
        <source src="https://vstark92.github.io/srimurugangold/SRI%20MURUGAN%20GOLD.mp4" type="video/mp4" />
        Your browser does not support video playback.
      </video>
    </div>
    <div class="divider"></div>
  </div>

  <script>
    const video = document.getElementById('vid');

    // Attempt autoplay; if browser blocks muted autoplay, show controls
    video.play().catch(() => {
      // Autoplay blocked — video still visible with controls for manual play
    });

    // Once user interacts, try with sound
    document.addEventListener('click', () => {
      if (video.muted) {
        video.muted = false;
        video.play().catch(() => {});
      }
    }, { once: true });
  </script>
</body>
</html>
